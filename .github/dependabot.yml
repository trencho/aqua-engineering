version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Skopje
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["eslint*", "@vue/eslint-config*", "prettier*", "vitest", "@vitest/*", "jsdom"]
      vue:
        patterns: ["vue", "vue-router", "vue-tsc", "@vitejs/plugin-vue", "@vue/*"]
    ignore:
      # Held deliberately, not an oversight. vue-tsc 3.3.11 resolves
      # typescript/lib/tsc, which TS 7 removed from its exports map, so the
      # build fails outright with ERR_PACKAGE_PATH_NOT_EXPORTED.
      # lift-when: vue-tsc ships a release that resolves the compiler without
      # that subpath; re-test with an actual `npm run build`, not the peer range.
      - dependency-name: typescript
        versions: [">=7.0.0"]

      # Held to the Node major the project actually runs (24, per .nvmrc and
      # CI). npm's latest tag for @types/node runs ahead of it, and Dependabot
      # opened exactly this bump minutes after the repo went public. Nothing
      # fails if it lands: the build type-checks happily against APIs the
      # runtime does not have, which is precisely why a bot must not decide it.
      # lift-when: .nvmrc moves to the next Node LTS; bump both together.
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Skopje

# Documented deviations, so the workflow-parity check reports these as known
# rather than as gaps:
#   - no package-retention.yml: this repo publishes no container images.
#
# codeql.yml is an ADDITION to the canonical set, not a substitute for anything
# in it. An earlier version of this file claimed it stood in for
# security-scan.yml; that was wrong. They scan different things — OSV reads
# yarn.lock for known advisories in the dependency tree, CodeQL analyses the
# code — so the repo ran with no dependency scan in CI until 2026-09-17, when
# security-scan.yml and dependency-cleanup.yml were added to match the fleet.
#
# The ecosystem below is `npm` even though this project uses Yarn Berry: that is
# Dependabot's name for the whole Node ecosystem, and it reads yarn.lock. Note
# that .yarnrc.yml sets npmMinimalAgeGate, so a Dependabot PR for a release
# younger than three days will fail `yarn install --immutable` in CI until the
# release ages past the gate. That is the gate working, not a broken PR.
#
# dependabot-auto-merge.yml is present but INERT until "Allow auto-merge" and a
# required, strict status check on main are enabled in repository settings.
