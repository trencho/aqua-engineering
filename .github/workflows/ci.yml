name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id `build` is canonical: the auto-merge convention gates on this exact
  # name, so renaming it silently breaks auto-merge.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Activate the Corepack-pinned Yarn (package.json "packageManager") BEFORE
      # setup-node, so its cache: yarn step can resolve Yarn's cache folder. The
      # runner's bundled Yarn is 1.x and refuses to answer `yarn cache dir` for a
      # yarn@4 pin, so this ordering is load bearing rather than cosmetic.
      - name: Enable Corepack
        run: corepack enable

      # node-version-file reads .nvmrc, so the repo and CI cannot drift apart.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      # `--immutable` installs exactly the committed yarn.lock and fails if
      # package.json and the lockfile disagree. A plain `yarn install` would
      # quietly rewrite the lockfile.
      - name: Install
        run: yarn install --immutable

      - name: Format
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test:coverage

      # No secrets here. The build must succeed without them, because a missing
      # key has to degrade (the contact form hides itself) rather than fail.
      - name: Build
        run: yarn build

      # The recovered assets are load-bearing and easy to lose in a refactor.
      - name: Verify build output
        run: |
          set -e
          for f in index.html .htaccess robots.txt sitemap.xml favicon.svg \
                   og-en.png og-mk.png google45a2ad3b9feccca7.html; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
          test -n "$(find dist/assets -name 'didact-gothic-cyrillic-*.woff2')" \
            || { echo 'Cyrillic font subset missing: the Macedonian page would fall back'; exit 1; }
          echo "all expected build outputs present"
