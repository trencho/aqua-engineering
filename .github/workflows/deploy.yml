name: Deploy

# Deploys on every push to main, as of the 2026-09-17 cutover.
#
# This was manual-only until then, because the document root still held the
# previous WordPress install and this job mirrors with delete: a push-triggered
# run would have wiped it and cut the site over by accident, before a backup
# existed. That reason is spent -- the root was backed up, emptied and replaced
# with this build -- so `main` is now the live site.
#
# `mirror --delete` still means a push removes whatever the build no longer
# produces, which is the point: a planted file cannot survive a deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

# Never let two deploys interleave, and never cancel one midway: a half-applied
# mirror would leave the document root incoherent.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      # Before setup-node: see the note in ci.yml.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}

      - name: Load deploy key and pinned host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/deploy
          install -m 600 /dev/null ~/.ssh/known_hosts
          echo "${{ secrets.CPANEL_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Fail here rather than mid-transfer if the key or host key is wrong.
      - name: Verify SSH authentication
        run: |
          ssh -i ~/.ssh/deploy -p "${{ secrets.CPANEL_PORT }}" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" true 2>&1 | tee out.txt || true
          # The host has shell disabled, so a refused shell still proves auth worked.
          grep -q 'Shell access is not enabled' out.txt \
            && echo 'auth OK (shell disabled, as expected)' && exit 0
          grep -qi 'permission denied\|host key verification failed' out.txt \
            && { echo 'SSH authentication failed'; cat out.txt; exit 1; }
          echo 'auth OK'

      - name: Resolve target path
        id: target
        run: |
          if [ "${{ github.event.inputs.target }}" = "staging" ]; then
            echo "path=${{ secrets.CPANEL_PATH }}/_staging" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ secrets.CPANEL_PATH }}" >> "$GITHUB_OUTPUT"
          fi

      # Transfer is over SFTP, not rsync, and that is not a preference.
      #
      # The host has shell access disabled on this account, so `rsync` cannot
      # run: it works by executing `rsync --server` on the far end, which needs
      # a shell. Verified against the live server on 2026-09-16 — SFTP connects
      # and `ssh ... 'rsync --version'` returns "Shell access is not enabled".
      # sshd serves SFTP through its internal subsystem, which is why one works
      # and the other does not. If the host ever enables shell, rsync becomes
      # the better tool and this step can go back to it.
      #
      # `mirror --reverse --delete` is the rsync --delete equivalent and is the
      # point of the step: anything the build no longer produces is removed, so
      # a stale or planted file cannot survive a deploy. .well-known is excluded
      # or this wipes the host's SSL validation directory.
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Mirror dist to cPanel over SFTP
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          PORT: ${{ secrets.CPANEL_PORT }}
          USER: ${{ secrets.CPANEL_USER }}
          TARGET: ${{ steps.target.outputs.path }}
        run: |
          set -euo pipefail
          lftp -c "
            set cmd:fail-exit yes;
            set sftp:auto-confirm no;
            set net:max-retries 2;
            set net:timeout 30;
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/deploy -p $PORT \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=$HOME/.ssh/known_hosts';
            open -u $USER, sftp://$HOST;
            mirror --reverse --delete --verbose --parallel=4 \
                   --exclude-glob .well-known/ \
                   dist/ $TARGET/;
            bye
          "

      # What can be checked depends on the target.
      #
      # The app is built for a document root: .htaccess routes /mk and /privacy
      # with root-absolute targets. Served from a subdirectory those resolve at
      # the real document root instead, so on staging only the entry page and
      # the static files are meaningful. A staging SUBDOMAIN with its own
      # document root would behave exactly like production; a subdirectory
      # cannot.
      - name: Smoke-check the deployed site
        env:
          HOST: ${{ secrets.CPANEL_HOST }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          base="https://$HOST"
          pages='/ /mk /privacy /mk/privacy'

          if [ "$TARGET" = "staging" ]; then
            base="$base/_staging"
            pages='/'
            echo "staging: checking the entry page and static files only."
            echo "routed paths need a document root - see the comment above this step."
          fi

          for path in $pages; do
            code=$(curl -sSL -o body.html -w '%{http_code}' --max-time 30 "$base$path")
            echo "$code  $path"
            [ "$code" = "200" ] || { echo "  expected 200"; exit 1; }
            # A status code alone proves little against a catch-all host, so
            # assert the response is ours and is the right language.
            grep -q 'id="app"' body.html || { echo "  not the Vue shell"; exit 1; }
            case "$path" in
              */mk*) grep -q 'mk_MK' body.html || { echo "  not the Macedonian shell"; exit 1; } ;;
              *)     grep -q 'en_GB' body.html || { echo "  not the English shell"; exit 1; } ;;
            esac
          done

          for path in /robots.txt /sitemap.xml /google45a2ad3b9feccca7.html; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "$base$path")
            echo "$code  $path"
            [ "$code" = "200" ] || { echo "  expected 200"; exit 1; }
          done

          # On a fallback host a missing file answers 200 with the app shell,
          # so check the content type rather than the status code.
          ct=$(curl -sSL -o /dev/null -w '%{content_type}' --max-time 30 "$base/robots.txt")
          case "$ct" in
            text/plain*) echo "robots.txt served as $ct" ;;
            *) echo "robots.txt served as $ct, not text/plain - the fallback is answering"; exit 1 ;;
          esac
