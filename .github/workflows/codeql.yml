# CodeQL static analysis.
#
# Committed as a workflow rather than switched on through GitHub's "default
# setup", so the configuration is reviewable in the tree and travels with a
# fork. Free on public repositories.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published advisory is found without waiting for a push.
    # Offset from the Dependabot window (Monday 06:00 Europe/Skopje) to keep the
    # two apart when reading results.
    - cron: '17 5 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # actions is included because the workflows themselves are attack
        # surface: an injected expression in a workflow runs with repo tokens.
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is broader than the default security-only
          # suite. This codebase is small enough to absorb the extra findings.
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
