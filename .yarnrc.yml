# Yarn Berry (4.x), Corepack-managed via the "packageManager" field in package.json.
# No Yarn binary is committed to .yarn/releases, matching the sibling frontends.

# Install into node_modules rather than Yarn's default Plug'n'Play resolution.
# Vite, vue-tsc and Vitest all resolve from disk; a PnP install of this project
# on 2026-09-17 broke the toolchain outright.
nodeLinker: node-modules

# Refuse packages published less than three days ago: the window in which a
# compromised release is typically caught and unpublished. Dependabot runs
# weekly here and auto-merges patch and minor bumps, so most releases it
# proposes are already past this gate by the time it opens the PR.
npmMinimalAgeGate: 4320
